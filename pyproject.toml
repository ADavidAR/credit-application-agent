[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credio-agent"
version = "0.1.0"
description = "Sistema inteligente de evaluación de solicitudes de crédito"
requires-python = ">=3.10"
authors = [
    { name = "Angel David Alvarado Reyes", email = "angeldaalvarado@gmail.com" }
]

dependencies = [
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "sqlalchemy>=2.0.0",
]
ui = [
    "gradio>=4.20.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=0.2.0",
    "requests>=2.31.0",
]

[project.scripts]
credio-api = "credio.api.main:main"
credio-ui = "credio.ui.main:main"